# ==============================================================================
# CyberSentinel Production Configuration (Render & Cloud MySQL)
# ==============================================================================

# Server port: Binds to Render-provided PORT when available (fallback: 8080)
server.port=${PORT:8080}

# Cloud MySQL Database Configuration
# Supports a full JDBC URL (DATABASE_URL or DB_URL) or individual host/port/database parameters
spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cybersentinel}?useSSL=true&serverTimezone=UTC&characterEncoding=utf8}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings for Cloud MySQL
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}

# Production JWT Secret (must be provided via environment variable; no hardcoded fallback)
cybersentinel.jwt.secret=${JWT_SECRET}

# CORS configuration for deployed frontend origins
cybersentinel.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Production Logging
logging.level.com.cybersentinel=INFO
