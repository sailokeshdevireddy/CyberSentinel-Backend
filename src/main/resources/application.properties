spring.application.name=cybersentinel
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}

# Contract: timestamps are ISO 8601 UTC strings, never epoch numbers
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# Schema is owned by Flyway (added in Phase 2); Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Comma-separated list of browser origins allowed to call /api/**
cybersentinel.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.jackson.deserialization.fail-on-unknown-properties=true
cybersentinel.jwt.expiration=86400000
cybersentinel.jwt.secret=${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
